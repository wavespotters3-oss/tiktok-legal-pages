<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram OAuth Callback</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Instagram OAuth Callback</h1>

    <section id="success" class="card hidden">
      <h2>Odebrano code</h2>
      <p>Skopiuj ten kod i wymień go lokalnie na access token.</p>

      <textarea id="code" readonly></textarea>

      <button id="copyCode">Kopiuj code</button>
    </section>

    <section id="error" class="card hidden">
      <h2>Błąd OAuth</h2>
      <p id="errorText"></p>
    </section>

    <section id="empty" class="card hidden">
      <h2>Brak parametru code</h2>
      <p>
        Ta strona powinna zostać otwarta przez przekierowanie z Instagrama,
        np. z parametrem <code>?code=...</code>.
      </p>
    </section>

    <section class="card">
      <h2>Aktualny URL callbacka</h2>
      <p id="currentUrl"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
